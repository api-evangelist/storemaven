name: Storemaven
description: >-
  Storemaven was an app-store-optimization (ASO) and app-marketing platform founded in Tel Aviv in
  2015 that pioneered App Store / Google Play A/B testing of icons, screenshots and videos using
  predictive, machine-learning-driven creative testing to lift install conversion rates for mobile
  app publishers. It was acquired by Zynga (Take-Two) in September 2022 and folded into the company's
  growth org, now operating as "mavens, a Zynga company." Storemaven shipped a login-gated SaaS
  dashboard and published no public developer API, OpenAPI, SDKs, or developer portal; the original
  storemaven.com domain has since lapsed and been repurposed into an unrelated third-party review
  site. This profile is retained as an acquired-company lead with no independent API surface.
